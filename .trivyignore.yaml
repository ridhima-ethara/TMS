# Accepted risks for Trivy (used by security/scan.sh). Each entry needs a reason
# and an expiry so it is re-reviewed.
vulnerabilities:
  - id: CVE-2026-93687
    paths:
      - "package-lock.json"
    statement: >-
      braces 3.0.3 (via tailwindcss 3 -> chokidar/micromatch). No fixed release
      exists; build-time only, globs our own source files, never runs on the
      live site. Accepted 2026-10-13; remove when a fix ships or on Tailwind 4.
    expired_at: 2027-01-31
misconfigurations:
  - id: DS-0002
    paths:
      - "docker/db/Dockerfile"
    statement: >-
      Official postgres image design: the entrypoint starts as root only to
      prepare the data directory, then drops to the 'postgres' user via gosu
      before the server runs. Accepted 2026-10-13.
    expired_at: 2027-10-13
